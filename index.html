<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YA Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --wa-bg: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            --wa-green: #075e54;
            --wa-my-msg: #dcf8c6;
            --wa-other-msg: #ffffff;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #128c7e; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        #login-screen input { padding: 15px; border-radius: 30px; border: none; width: 280px; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; }
        #login-screen button { padding: 12px 40px; background: #075e54; border: none; color: white; border-radius: 30px; cursor: pointer; font-weight: bold; }

        #chat-container { display: none; flex-direction: column; height: 100vh; background-color: #e5ddd5; background-image: var(--wa-bg); background-size: cover; background-position: center; transition: 0.5s; }

        header { background: var(--wa-green); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ece5dd; display: flex; align-items: center; justify-content: center; color: #075e54; font-weight: bold; }
        
        .header-actions { display: flex; gap: 15px; }
        .action-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        #bg-panel { display: none; position: absolute; top: 60px; left: 10px; background: white; padding: 10px; border-radius: 8px; z-index: 50; width: 150px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .bg-option { width: 40px; height: 40px; border-radius: 4px; cursor: pointer; display: inline-block; margin: 3px; border: 1px solid #ddd; background-size: cover; }

        #messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; position: relative; font-size: 0.95rem; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-start; background: var(--wa-my-msg); border-top-right-radius: 0; }
        .received { align-self: flex-end; background: var(--wa-other-msg); border-top-left-radius: 0; }
        .user-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; display: block; }
        .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-size: 0.65rem; color: #777; margin-top: 4px; }
        .read-status { color: #34b7f1; font-weight: bold; }
        .heart-icon { position: absolute; bottom: -10px; left: -10px; font-size: 1.2rem; display: none; }
        .has-heart .heart-icon { display: block; animation: pop 0.3s ease; }

        .input-area { background: #f0f0f0; padding: 8px 15px; display: flex; gap: 10px; align-items: center; }
        input#msg-input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        #send-btn { background: #128c7e; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* XO Online Modal */
        #xo-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .xo-grid { display: grid; grid-template-columns: repeat(3, 85px); gap: 10px; }
        .xo-cell { width: 85px; height: 85px; background: #fff; color: #333; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; }
        #turn-info { margin-bottom: 15px; font-size: 1.2rem; color: #25d366; font-weight: bold; }

        @keyframes pop { 0% {transform: scale(0);} 100% {transform: scale(1.2);} }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>YA</h1>
        <input type="text" id="username" placeholder="اكتب اسمك هنا">
        <button onclick="login()">دخول</button>
    </div>

    <div id="chat-container">
        <header>
            <div class="user-info">
                <div class="avatar" id="user-avatar">?</div>
                <div>
                    <div style="font-weight: bold;" id="display-name">YA Chat</div>
                    <div style="font-size: 0.7rem; color: #d1d1d1;">متصل الآن</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="action-btn" onclick="checkXOPassword()" title="لعب XO أونلاين">🎮</button>
                <button class="action-btn" onclick="toggleBgPanel()">🎨</button>
            </div>
            <div id="bg-panel">
                <div class="bg-option" style="background-image: url('https://images.unsplash.com/photo-1522030239044-123496033984?q=80')" onclick="changeBg(this.style.backgroundImage)"></div>
                <div class="bg-option" style="background-image: url('https://images.unsplash.com/photo-1532693322450-2cb5c511067d?q=80')" onclick="changeBg(this.style.backgroundImage)"></div>
                <div class="bg-option" style="background-image: url('https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?q=80')" onclick="changeBg(this.style.backgroundImage)"></div>
                <div class="bg-option" style="background-image: url('https://images.unsplash.com/photo-1505506005810-7f737514c5d3?q=80')" onclick="changeBg(this.style.backgroundImage)"></div>
            </div>
        </header>

        <div id="messages-area"></div>
        <div id="typing-status" style="padding: 0 20px; font-size: 0.8rem; height: 20px;"></div>

        <div class="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالة..." oninput="notifyTyping()">
            <button id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div id="xo-modal">
        <div id="turn-info">انتظر دورك...</div>
        <h2 id="xo-status">لعبة XO أونلاين</h2>
        <div class="xo-grid" id="xo-board-el">
            <div class="xo-cell" onclick="playOnlineMove(0)"></div><div class="xo-cell" onclick="playOnlineMove(1)"></div><div class="xo-cell" onclick="playOnlineMove(2)"></div>
            <div class="xo-cell" onclick="playOnlineMove(3)"></div><div class="xo-cell" onclick="playOnlineMove(4)"></div><div class="xo-cell" onclick="playOnlineMove(5)"></div>
            <div class="xo-cell" onclick="makeMove(6)"></div><div class="xo-cell" onclick="playOnlineMove(6)"></div><div class="xo-cell" onclick="playOnlineMove(7)"></div><div class="xo-cell" onclick="playOnlineMove(8)"></div>
        </div>
        <button style="margin-top:25px; padding:10px 30px; background:#25d366; color:white; border:none; cursor:pointer;" onclick="resetOnlineXO()">إعادة اللعب للجميع</button>
        <button style="margin-top:10px; color:red; background:none; border:none; cursor:pointer;" onclick="document.getElementById('xo-modal').style.display='none'">إغلاق</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB2m_lxcrNrh0sKBxnLxMcXsRSTJ2UXJho",
            authDomain: "xo-game-af8b9.firebaseapp.com",
            projectId: "xo-game-af8b9",
            storageBucket: "xo-game-af8b9.firebasestorage.app",
            messagingSenderId: "244059743073",
            appId: "1:244059743073:web:03866f61fe0193af1f5b20",
            measurementId: "G-63ELBNX22C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";

        // دخول الشات
        function login() {
            const name = document.getElementById('username').value.trim();
            if (!name) return alert("ادخل اسمك");
            currentUser = name;
            document.getElementById('user-avatar').innerText = name[0].toUpperCase();
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-container').style.display = 'flex';
            loadMessages();
            listenToTyping();
            syncXO(); // ربط اللعبة بقاعدة البيانات
        }

        function checkXOPassword() {
            const pass = prompt("دخل الرقم السري للانضمام للعبة:");
            if (pass === "112006") {
                document.getElementById('xo-modal').style.display = 'flex';
            } else {
                alert("الرقم السري غلط!");
            }
        }

        // إرسال رسالة
        function sendMessage() {
            const text = document.getElementById('msg-input').value.trim();
            if (!text) return;
            const now = new Date();
            const time = now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
            db.ref('messages').push({ user: currentUser, text: text, time: time, timestamp: Date.now(), heart: false, read: false });
            document.getElementById('msg-input').value = "";
        }

        function loadMessages() {
            db.ref('messages').on('value', (snap) => {
                const area = document.getElementById('messages-area');
                area.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    const isMe = data.user === currentUser;
                    if (!isMe && !data.read) db.ref('messages/' + child.key).update({ read: true });
                    const div = document.createElement('div');
                    div.className = `message ${isMe ? 'sent' : 'received'} ${data.heart ? 'has-heart' : ''}`;
                    div.innerHTML = `<span class="user-name">${data.user}</span>${data.text}<div class="msg-footer"><span>${data.time}</span>${isMe ? `<span class="read-status">${data.read ? '✓✓' : '✓'}</span>` : ''}</div><span class="heart-icon">❤️</span>`;
                    div.ondblclick = () => db.ref('messages/' + child.key).update({ heart: !data.heart });
                    area.appendChild(div);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        // --- نظام XO أونلاين المطور ---
        let currentBoard = Array(9).fill("");
        let lastPlayer = "";

        function syncXO() {
            db.ref('xo_game').on('value', snap => {
                const data = snap.val() || { board: Array(9).fill(""), lastPlayer: "", winner: "" };
                currentBoard = data.board;
                lastPlayer = data.lastPlayer;
                
                // تحديث واجهة اللعبة
                const cells = document.getElementsByClassName('xo-cell');
                for(let i=0; i<9; i++) {
                    cells[i].innerText = currentBoard[i];
                }

                if(data.winner) {
                    document.getElementById('xo-status').innerText = "الفائز: " + data.winner;
                    document.getElementById('turn-info').innerText = "انتهت اللعبة!";
                } else {
                    document.getElementById('xo-status').innerText = "لعبة XO أونلاين";
                    document.getElementById('turn-info').innerText = (lastPlayer === currentUser) ? "انتظر دور الطرف الآخر..." : "دورك الآن!";
                }
            });
        }

        function playOnlineMove(i) {
            // التحقق: هل الخلية فارغة؟ هل اللعبة انتهت؟ هل هذا دورك؟
            if (currentBoard[i] === "" && lastPlayer !== currentUser) {
                const symbol = (lastPlayer === "" || currentBoard.filter(x=>x!=="").length % 2 === 0) ? "X" : "O";
                currentBoard[i] = symbol;
                
                let winnerName = "";
                if (checkWinner(currentBoard)) winnerName = currentUser;
                else if (!currentBoard.includes("")) winnerName = "تعادل";

                db.ref('xo_game').set({
                    board: currentBoard,
                    lastPlayer: currentUser,
                    winner: winnerName
                });
            } else if (lastPlayer === currentUser) {
                alert("مش دورك! استنى التاني يلعب.");
            }
        }

        function checkWinner(b) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(s => b[s[0]] && b[s[0]]===b[s[1]] && b[s[0]]===b[s[2]]);
        }

        function resetOnlineXO() {
            db.ref('xo_game').set({ board: Array(9).fill(""), lastPlayer: "", winner: "" });
        }

        // وظائف إضافية
        function toggleBgPanel() { 
            const p = document.getElementById('bg-panel'); 
            p.style.display = p.style.display === 'block' ? 'none' : 'block'; 
        }
        function changeBg(url) { document.getElementById('chat-container').style.backgroundImage = url; toggleBgPanel(); }
        function notifyTyping() { 
            db.ref('typing/' + currentUser).set(true); 
            setTimeout(() => db.ref('typing/' + currentUser).remove(), 3000); 
        }
        function listenToTyping() {
            db.ref('typing').on('value', snap => {
                let t = []; snap.forEach(u => { if(u.key !== currentUser) t.push(u.key); });
                document.getElementById('typing-status').innerText = t.length ? t[0] + " يكتب الآن..." : "";
            });
        }
        document.getElementById('msg-input').onkeypress = (e) => { if(e.key==="Enter") sendMessage(); };
    </script>
</body>
</html>
